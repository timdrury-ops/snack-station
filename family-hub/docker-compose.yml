# Run on any always-on computer at home (Raspberry Pi 4/5, old laptop, NAS):
#   cp .env.example .env   # fill it in
#   docker compose up -d
services:
  family-hub:
    build: { context: .., dockerfile: family-hub/Dockerfile }
    env_file: .env
    ports: ["3000:3000"]
    volumes: ["./data:/data"]
    restart: unless-stopped

